function qrSvg(t){if(window.qrcode){try{const q=qrcode(0,'M');q.addData(t);q.make();const n=q.getModuleCount();let p='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))p+=`M${c} ${r}h1v1h-1z`;return`<svg viewBox="-2 -2 ${n+4} ${n+4}" width="100%" shape-rendering="crispEdges" style="background:#fff"><path d="${p}" fill="#000"/></svg>`}catch(e){}}const x=hs(t),n=25;let p='';for(let r=0;r<n;r++)for(let c=0;c<n;c++){const f=(r<7&&c<7)||(r<7&&c>17)||(r>17&&c<7),b=f?((r%6==0||c%6==0||(r>1&&r<5&&c>1&&c<5)||(r>1&&r<5&&c>19&&c<23)||(r>19&&r<23&&c>1&&c<5))):(((x>>>((r*n+c)%31))^(r*c))&1);if(b)p+=`M${c} ${r}h1v1h-1z`}return`<svg viewBox="-2 -2 ${n+4} ${n+4}" width="100%" shape-rendering="crispEdges" style="background:#fff"><path d="${p}" fill="#000"/></svg>`}

function qrv(code){const a=String(code).split(':');if(a[0]!='KK1'||a.length<6)return{lv:'bad',msg:'QR tidak dikenali'};const[,nis,id,k,d,ck]=a,m=MS.find(x=>x.nis==nis);if(!m||ck!=chk(nis,id,k,d))return{lv:'bad',msg:'QR tidak dikenali atau tidak valid'};const p=pjl(m).find(x=>pid(m,x)==id);if(!p)return{lv:'bad',msg:'Penjemput sudah tidak terdaftar',m};if(k=='S'){if(D.plan=='standard')return{lv:'bad',msg:'QR pengganti tersedia di paket Pro',m,p};if(d!=TODAY)return{lv:'bad',msg:'QR pengganti tidak berlaku hari ini (berlaku '+fd(d)+')',m,p};return{lv:'sub',msg:'QR pengganti berlaku hari ini',m,p}}return{lv:'ok',msg:'QR tetap terverifikasi',m,p}}
